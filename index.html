<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>沖繩分帳小幫手</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--tx:#1b2430;--mu:#6b7686;--ac:#0a7ea4;--bd:#e1e6ee}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--card:#1a212b;--tx:#e8edf3;--mu:#93a0b2;--ac:#4cc3e8;--bd:#2a3340}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:env(safe-area-inset-top,0) 12px 40px}
main{max-width:640px;margin:auto}h1{font-size:19px;margin:14px 2px 4px}h2{font-size:16px;margin:16px 2px 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.mu{color:var(--mu);font-size:13px}input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:3px 0}
.row{display:flex;gap:6px}.row>*{flex:1}.btn{display:inline-block;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:18px;padding:7px 13px;font-size:14px;margin:3px 3px 3px 0;text-decoration:none}.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
label{display:inline-block;margin-right:12px}label input{width:auto}
</style>
<!-- LINE LIFF SDK（網址必須完整） -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head><body><main>
<h1>💴 沖繩分帳小幫手</h1>
<div id="st" class="mu" style="background:var(--card);padding:6px 12px;border-radius:8px;border:1px dashed var(--bd)">連線中…</div>
<div id="form"></div><div id="sum"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBjjRmLpPsKpdpU5G3v-8BrzmXdLjsSQQk",
  authDomain: "okinawa1218-1222.firebaseapp.com",
  databaseURL: "https://okinawa1218-1222-default-rtdb.firebaseio.com",
  projectId: "okinawa1218-1222",
  storageBucket: "okinawa1218-1222.appspot.com",
  messagingSenderId: "1044993768754",
  appId: "1:1044993768754:web:51ebcf7a25db0bcb4d2b2b"
};
const db = getDatabase(initializeApp(firebaseConfig));

const N = ["ANITA", "Kelly", "小美", "宜宜"];
const ROOM = "okinawa_k7x2q9";   // 建議改成一串不易猜的字，例如 okinawa_k7x2q9
let X = [], rate = 0.21, me = localStorage.me || "ANITA", msg = "";

const $ = s => document.querySelector(s);
const e = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const J = x => x.cur == "TWD" ? x.amt / rate : x.amt;
const fy = n => "¥" + Math.round(n).toLocaleString();
const ft = n => "NT$" + Math.round(n * rate).toLocaleString();

const tw = n => "NT$" + Math.round(n).toLocaleString();
const T = x => Math.round(x.cur == "TWD" ? x.amt : x.amt * rate);          // 單筆換成台幣
const isTr = x => String(x.d || "").startsWith("[轉帳]");
const nm = x => String(x.d || "").replace("[轉帳]", "");
const sum = a => a.reduce((s, v) => s + v.amt, 0);

// 兩兩對帳：每一對人，列出「誰欠誰什麼」互相抵銷後的結果
function pairs() {
  const own = {}, pay = {};
  N.forEach(a => { own[a] = {}; pay[a] = {}; N.forEach(b => { own[a][b] = []; pay[a][b] = []; }); });
  X.forEach(x => {
    const sp = (x.sp || []).filter(n => N.includes(n));
    if (!N.includes(x.by)) return;
    if (isTr(x)) { const to = sp[0]; if (to && to !== x.by) pay[x.by][to].push({ d: nm(x), amt: T(x) }); return; }
    if (!sp.length) return;
    const part = Math.round(T(x) / sp.length);
    sp.forEach(q => { if (q !== x.by) own[q][x.by].push({ d: x.d, amt: part }); });
  });
  const out = [], pays = {}, recv = {};
  N.forEach(n => { pays[n] = 0; recv[n] = 0; });
  for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
    const a = N[i], b = N[j];
    if (![own[a][b], own[b][a], pay[a][b], pay[b][a]].some(l => l.length)) continue;
    const net = sum(own[a][b]) - sum(own[b][a]) - sum(pay[a][b]) + sum(pay[b][a]);
    const [f, t] = net >= 0 ? [a, b] : [b, a];
    const lines = [
      ...own[f][t].map(v => ["＋", f + " → " + t + "　" + v.d, v.amt]),
      ...own[t][f].map(v => ["－", t + " → " + f + "　" + v.d, v.amt]),
      ...pay[f][t].map(v => ["－", f + " → " + t + "　已轉帳：" + v.d, v.amt]),
      ...pay[t][f].map(v => ["＋", t + " → " + f + "　已轉帳：" + v.d, v.amt])
    ];
    out.push({ f, t, lines, net: Math.abs(net) });
    pays[f] += Math.abs(net); recv[t] += Math.abs(net);
  }
  return { out, pays, recv };
}
const lineTxt = (l, i) => (i == 0 && l[0] == "＋" ? "" : l[0]) + l[1] + "　" + tw(l[2]);
function text() {
  const { out } = pairs(), tot = X.filter(x => !isTr(x)).reduce((s, x) => s + T(x), 0);
  return "【石垣島・沖繩 分帳明細（台幣）】\n總支出 " + tw(tot) + "（匯率 1 日圓=" + rate + " 台幣）\n" +
    (out.length ? out.map(p => "\n" + p.f + " → " + p.t + "\n" + p.lines.map((l, i) => lineTxt(l, i)).join("\n") + "\n＝ " + (p.net ? p.f + " → " + p.t + "　" + tw(p.net) : "已結清")).join("\n") : "目前沒有需要結算的款項");
}

// 表單只畫一次，避免別人新增資料時把你正在輸入的內容清掉
function drawForm() {
  $("#form").innerHTML = `
  <div class="card"><b>匯率</b><div class="row"><input id="rt" type="number" step="0.001" value="${rate}"><span class="mu" style="align-self:center">1 日圓 = ? 台幣（全員同步）</span></div></div>
  <div class="card"><b>新增花費</b>
    <input id="d" placeholder="項目（例：午餐）">
    <div class="row"><input id="a" type="number" placeholder="金額"><select id="c"><option>JPY</option><option>TWD</option></select></div>
    <div class="mu">付款人</div>
    <select id="by">${N.map(n => `<option ${n === me ? "selected" : ""}>${n}</option>`).join("")}</select>
    <div class="mu">分攤成員</div>
    ${N.map(n => `<label><input type="checkbox" class="sp" value="${n}" checked> ${n}</label>`).join("")}
    <div style="margin-top:8px"><button class="btn p" id="add">新增記帳</button><button class="btn" id="dep">📥 包車訂金（Anita 付 NT$900）</button></div>
    <div class="mu" id="msg" style="color:red"></div></div>
  <div class="card"><b>記錄已轉帳（誰已付給誰，台幣）</b>
    <div class="row"><select id="tf">${N.map(n => `<option>${n}</option>`).join("")}</select><span style="flex:0;align-self:center">→</span><select id="tt">${N.map((n, i) => `<option ${i == 0 ? "selected" : ""}>${n}</option>`).join("")}</select></div>
    <div class="row"><input id="ta" type="number" placeholder="金額 NT$"><input id="tn" placeholder="備註（例：包車訂金）"></div>
    <button class="btn p" id="tradd">記錄已轉帳</button><button class="btn" id="pdep">✅ 小美、Kelly 已各付 NT$225 給 ANITA（包車訂金）</button></div>`;
}
function drawSum() {
  const { out, pays, recv } = pairs(), tot = X.filter(x => !isTr(x)).reduce((s, x) => s + T(x), 0);
  $("#sum").innerHTML = `
  <div class="card"><b>分帳明細（全部換算成台幣）</b>　總支出 ${tw(tot)}
    <div class="mu">匯率 1 日圓 = ${rate} 台幣；每筆均分後四捨五入，所以明細加總可能與實際相差幾元。</div></div>
  ${out.length ? out.map(p => `<div class="card"><b>${p.f} → ${p.t}</b>
    ${p.lines.map((l, i) => `<div>${i == 0 && l[0] == "＋" ? "" : '<span class="mu">' + l[0] + '</span> '}${e(l[1])}　<b>${tw(l[2])}</b></div>`).join("")}
    <hr style="border:0;border-top:1px solid var(--bd)"><div>＝ ${p.net ? `${p.f} → ${p.t}　<b>${tw(p.net)}</b>` : "<b>已結清 ✓</b>"}</div></div>`).join("") : '<div class="card mu">目前沒有需要結算的款項</div>'}
  <div class="card"><b>每人合計</b>${N.map(n => `<div>${n}：要付出 ${tw(pays[n])}，可收到 ${tw(recv[n])}</div>`).join("")}
    <div style="margin-top:8px"><a class="btn p" target="_blank" href="https://line.me/R/share?text=${encodeURIComponent(text())}">分享明細到 LINE 群組</a><button class="btn" id="cp">複製明細文字</button></div></div>
  <h2>全部紀錄（${X.length} 筆）</h2>
  ${X.slice().sort((a, c) => c.ts - a.ts).map(x => isTr(x) ?
    `<div class="card">💸 ${e(x.by)} → ${e((x.sp || [])[0])} 已轉帳 <b>${tw(T(x))}</b> <span class="mu">${e(nm(x))}</span> <a href="#" data-del="${e(x.id)}" style="color:red;margin-left:8px">刪除</a></div>` :
    `<div class="card">${e(x.d)} <b>${x.cur == "TWD" ? "NT$" : "¥"}${Number(x.amt).toLocaleString()}</b>${x.cur == "TWD" ? "" : ` <span class="mu">≈ ${tw(T(x))}</span>`}
      <div class="mu">${e(x.by)} 付・${(x.sp || []).map(e).join("、")} 分攤 <a href="#" data-del="${e(x.id)}" style="color:red;margin-left:8px">刪除</a></div></div>`).join("")}`;
}

function listen() {
  const fail = err => { $("#st").textContent = "🔴 資料庫連線失敗：請檢查 databaseURL 與資料庫規則（" + (err.code || err.message) + "）"; };
  onValue(ref(db, `rooms/${ROOM}/rate`), s => {
    const v = s.val();
    if (v) { rate = v; const r = $("#rt"); if (r && document.activeElement !== r) r.value = v; drawSum(); }
  }, fail);
  onValue(ref(db, `rooms/${ROOM}/records`), s => {
    const d = s.val(); X = d ? Object.keys(d).map(k => ({ id: k, ...d[k] })) : []; drawSum();
  }, fail);
}

// LINE LIFF：不強制登入，避免在一般瀏覽器反覆跳轉登入頁
async function initLiff() {
  const st = $("#st");
  try {
    await liff.init({ liffId: "2011929552-o4OCxhhm" });
    if (liff.isInClient() || liff.isLoggedIn()) {
      const p = await liff.getProfile();
      const m = N.find(n => n.toLowerCase() === p.displayName.trim().toLowerCase());
      if (m) { me = m; localStorage.me = m; const by = $("#by"); if (by) by.value = m; }
      st.textContent = "🟢 " + p.displayName + " 已連線（付款人預設：" + me + "）";
    } else {
      st.innerHTML = "🟡 未登入 LINE（仍可記帳，只是不會自動帶入付款人）<br><button class=\"btn p\" id=\"lg\">用 LINE 登入</button>";
    }
  } catch (x) {
    st.textContent = "🟡 LINE 初始化失敗，改用一般模式：" + (x.message || x);
  }
}

async function copy(t) { try { await navigator.clipboard.writeText(t); return true; } catch (x) { return false; } }

document.addEventListener("click", async ev => {
  const t = ev.target;
  if (t.id == "add") {
    const a = +$("#a").value, sp = [...document.querySelectorAll(".sp:checked")].map(x => x.value);
    if (a > 0 && sp.length) {
      await set(push(ref(db, `rooms/${ROOM}/records`)), { d: $("#d").value || "花費", amt: a, cur: $("#c").value, by: $("#by").value, sp, ts: Date.now() });
      $("#d").value = ""; $("#a").value = ""; $("#msg").textContent = "";
    } else { $("#msg").textContent = "請填金額並至少勾選一位分攤成員"; }
  }
  if (t.id == "tradd") {
    const a = +$("#ta").value, f = $("#tf").value, to = $("#tt").value;
    if (a > 0 && f !== to) { await set(push(ref(db, `rooms/${ROOM}/records`)), { d: "[轉帳]" + ($("#tn").value || "已轉帳"), amt: a, cur: "TWD", by: f, sp: [to], ts: Date.now() }); $("#ta").value = ""; $("#tn").value = ""; }
    else { $("#msg").textContent = "請填金額，且付款人與收款人不能相同"; }
  }
  if (t.id == "pdep") {
    await set(ref(db, `rooms/${ROOM}/records/paid-dep-mei`), { d: "[轉帳]包車訂金", amt: 225, cur: "TWD", by: "小美", sp: ["ANITA"], ts: Date.now() });
    await set(ref(db, `rooms/${ROOM}/records/paid-dep-kelly`), { d: "[轉帳]包車訂金", amt: 225, cur: "TWD", by: "Kelly", sp: ["ANITA"], ts: Date.now() });
  }
  if (t.id == "dep") {
    await set(ref(db, `rooms/${ROOM}/records/charter-dep`), { d: "包車訂金（Anita 已付）", amt: 900, cur: "TWD", by: "ANITA", sp: N.slice(), ts: Date.now() });
  }
  if (t.dataset.del) {
    ev.preventDefault();
    if (confirm("確定要刪除這筆花費嗎？")) await set(ref(db, `rooms/${ROOM}/records/${t.dataset.del}`), null);
  }
  if (t.id == "lg") { try { liff.login({ redirectUri: location.href }); } catch (x) { $("#st").textContent = "登入失敗：" + (x.message || x); } }
  if (t.id == "cp") {
    const ok = await copy(text());
    t.textContent = ok ? "已複製 ✓" : "複製失敗"; setTimeout(() => t.textContent = "複製明細文字", 2000);
  }
});
document.addEventListener("change", async ev => {
  if (ev.target.id == "by") localStorage.me = me = ev.target.value;
  if (ev.target.id == "rt" && +ev.target.value > 0) await set(ref(db, `rooms/${ROOM}/rate`), +ev.target.value);
});

drawForm(); drawSum(); listen(); initLiff();
</script>
</main></body></html>
