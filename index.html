<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>沖繩分帳小幫手</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--tx:#1b2430;--mu:#6b7686;--ac:#0a7ea4;--bd:#e1e6ee}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--card:#1a212b;--tx:#e8edf3;--mu:#93a0b2;--ac:#4cc3e8;--bd:#2a3340}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:env(safe-area-inset-top,0) 12px 40px}
main{max-width:640px;margin:auto}h1{font-size:19px;margin:14px 2px 4px}h2{font-size:16px;margin:16px 2px 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.mu{color:var(--mu);font-size:13px}input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:3px 0}
.row{display:flex;gap:6px}.row>*{flex:1}.btn{display:inline-block;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:18px;padding:7px 13px;font-size:14px;margin:3px 3px 3px 0;text-decoration:none}.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
label{display:inline-block;margin-right:12px}label input{width:auto}
</style>
<!-- LINE LIFF SDK（網址必須完整） -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head><body><main>
<h1>💴 沖繩分帳小幫手</h1>
<div id="st" class="mu" style="background:var(--card);padding:6px 12px;border-radius:8px;border:1px dashed var(--bd)">連線中…</div>
<div id="form"></div><div id="sum"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBjjRmLpPsKpdpU5G3v-8BrzmXdLjsSQQk",
  authDomain: "okinawa1218-1222.firebaseapp.com",
  databaseURL: "https://okinawa1218-1222-default-rtdb.firebaseio.com",
  projectId: "okinawa1218-1222",
  storageBucket: "okinawa1218-1222.appspot.com",
  messagingSenderId: "1044993768754",
  appId: "1:1044993768754:web:51ebcf7a25db0bcb4d2b2b"
};
const db = getDatabase(initializeApp(firebaseConfig));

const N = ["ANITA", "Kelly", "小美", "宜宜"];
const ROOM = "okinawa_k7x2q9";   // 建議改成一串不易猜的字，例如 okinawa_k7x2q9
let X = [], rate = 0.21, me = localStorage.me || "ANITA", msg = "";

const $ = s => document.querySelector(s);
const e = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const J = x => x.cur == "TWD" ? x.amt / rate : x.amt;
const fy = n => "¥" + Math.round(n).toLocaleString();
const ft = n => "NT$" + Math.round(n * rate).toLocaleString();

function calc() {
  const b = {}; N.forEach(n => b[n] = 0);
  X.forEach(x => {
    const p = (x.sp || []).filter(n => n in b);
    if (!p.length || !(x.by in b)) return;
    b[x.by] += J(x); p.forEach(n => b[n] -= J(x) / p.length);
  });
  const cr = N.filter(n => b[n] > 1).map(n => [n, b[n]]).sort((a, c) => c[1] - a[1]),
        de = N.filter(n => b[n] < -1).map(n => [n, -b[n]]).sort((a, c) => c[1] - a[1]), t = [];
  let i = 0, j = 0;
  while (i < cr.length && j < de.length) {
    const m = Math.min(cr[i][1], de[j][1]);
    t.push([de[j][0], cr[i][0], m]); cr[i][1] -= m; de[j][1] -= m;
    if (cr[i][1] < 1) i++; if (de[j][1] < 1) j++;
  }
  return { b, t };
}
function text() {
  const { t } = calc(), tot = X.reduce((s, x) => s + J(x), 0);
  return "【石垣島・沖繩 分帳結算】\n總支出 " + fy(tot) + "（約 " + ft(tot) + "，匯率 " + rate + "）\n" +
    (t.length ? t.map(r => r[0] + " → " + r[1] + " " + fy(r[2]) + "（約 " + ft(r[2]) + "）").join("\n") : "目前沒有需要轉帳的款項");
}

// 表單只畫一次，避免別人新增資料時把你正在輸入的內容清掉
function drawForm() {
  $("#form").innerHTML = `
  <div class="card"><b>匯率</b><div class="row"><input id="rt" type="number" step="0.001" value="${rate}"><span class="mu" style="align-self:center">1 日圓 = ? 台幣（全員同步）</span></div></div>
  <div class="card"><b>新增花費</b>
    <input id="d" placeholder="項目（例：午餐）">
    <div class="row"><input id="a" type="number" placeholder="金額"><select id="c"><option>JPY</option><option>TWD</option></select></div>
    <div class="mu">付款人</div>
    <select id="by">${N.map(n => `<option ${n === me ? "selected" : ""}>${n}</option>`).join("")}</select>
    <div class="mu">分攤成員</div>
    ${N.map(n => `<label><input type="checkbox" class="sp" value="${n}" checked> ${n}</label>`).join("")}
    <div style="margin-top:8px"><button class="btn p" id="add">新增記帳</button><button class="btn" id="dep">📥 包車訂金（Anita 付 NT$900）</button></div>
    <div class="mu" id="msg" style="color:red"></div></div>`;
}
function drawSum() {
  const { b, t } = calc(), tot = X.reduce((s, x) => s + J(x), 0);
  $("#sum").innerHTML = `
  <div class="card"><b>結算總覽（雲端同步）</b>　總支出 ${fy(tot)}（約 ${ft(tot)}）
    ${N.map(n => `<div>${n}：${b[n] >= 0 ? "應收" : "應付"} ${fy(Math.abs(b[n]))}</div>`).join("")}
    <hr style="border:0;border-top:1px solid var(--bd)">
    ${t.length ? t.map(r => `<div>💸 ${r[0]} → ${r[1]}　<b>${fy(r[2])}</b> <span class="mu">約 ${ft(r[2])}</span></div>`).join("") : '<div class="mu">目前不需要轉帳</div>'}
    <div style="margin-top:8px"><a class="btn p" target="_blank" href="https://line.me/R/share?text=${encodeURIComponent(text())}">分享結算到 LINE 群組</a><button class="btn" id="cp">複製結算文字</button></div></div>
  <h2>全部花費（${X.length} 筆）</h2>
  ${X.slice().sort((a, c) => c.ts - a.ts).map(x => `
    <div class="card">${e(x.d)} <b>${x.cur == "TWD" ? "NT$" : "¥"}${Number(x.amt).toLocaleString()}</b>
      <div class="mu">${e(x.by)} 付・${(x.sp || []).map(e).join("、")} 分攤 <a href="#" data-del="${e(x.id)}" style="color:red;margin-left:8px">刪除</a></div></div>`).join("")}`;
}

function listen() {
  const fail = err => { $("#st").textContent = "🔴 資料庫連線失敗：請檢查 databaseURL 與資料庫規則（" + (err.code || err.message) + "）"; };
  onValue(ref(db, `rooms/${ROOM}/rate`), s => {
    const v = s.val();
    if (v) { rate = v; const r = $("#rt"); if (r && document.activeElement !== r) r.value = v; drawSum(); }
  }, fail);
  onValue(ref(db, `rooms/${ROOM}/records`), s => {
    const d = s.val(); X = d ? Object.keys(d).map(k => ({ id: k, ...d[k] })) : []; drawSum();
  }, fail);
}

// LINE LIFF：不強制登入，避免在一般瀏覽器反覆跳轉登入頁
async function initLiff() {
  const st = $("#st");
  try {
    await liff.init({ liffId: "2011929552-o4OCxhhm" });
    if (liff.isInClient() || liff.isLoggedIn()) {
      const p = await liff.getProfile();
      const m = N.find(n => n.toLowerCase() === p.displayName.trim().toLowerCase());
      if (m) { me = m; localStorage.me = m; const by = $("#by"); if (by) by.value = m; }
      st.textContent = "🟢 " + p.displayName + " 已連線（付款人預設：" + me + "）";
    } else {
      st.textContent = "🟡 一般瀏覽器模式（未登入 LINE，仍可記帳；建議從 LINE 群組的連結開啟）";
    }
  } catch (x) {
    st.textContent = "🟡 LINE 初始化失敗，改用一般模式：" + (x.message || x);
  }
}

async function copy(t) { try { await navigator.clipboard.writeText(t); return true; } catch (x) { return false; } }

document.addEventListener("click", async ev => {
  const t = ev.target;
  if (t.id == "add") {
    const a = +$("#a").value, sp = [...document.querySelectorAll(".sp:checked")].map(x => x.value);
    if (a > 0 && sp.length) {
      await set(push(ref(db, `rooms/${ROOM}/records`)), { d: $("#d").value || "花費", amt: a, cur: $("#c").value, by: $("#by").value, sp, ts: Date.now() });
      $("#d").value = ""; $("#a").value = ""; $("#msg").textContent = "";
    } else { $("#msg").textContent = "請填金額並至少勾選一位分攤成員"; }
  }
  if (t.id == "dep") {
    await set(ref(db, `rooms/${ROOM}/records/charter-dep`), { d: "包車訂金（Anita 已付）", amt: 900, cur: "TWD", by: "ANITA", sp: N.slice(), ts: Date.now() });
  }
  if (t.dataset.del) {
    ev.preventDefault();
    if (confirm("確定要刪除這筆花費嗎？")) await set(ref(db, `rooms/${ROOM}/records/${t.dataset.del}`), null);
  }
  if (t.id == "cp") {
    const ok = await copy(text());
    t.textContent = ok ? "已複製 ✓" : "複製失敗"; setTimeout(() => t.textContent = "複製結算文字", 2000);
  }
});
document.addEventListener("change", async ev => {
  if (ev.target.id == "by") localStorage.me = me = ev.target.value;
  if (ev.target.id == "rt" && +ev.target.value > 0) await set(ref(db, `rooms/${ROOM}/rate`), +ev.target.value);
});

drawForm(); drawSum(); listen(); initLiff();
</script>
</main></body></html>
